services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: wildlife-inference:latest
    container_name: wildlife-inference
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
